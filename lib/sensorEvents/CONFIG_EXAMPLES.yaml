# Example configuration for sensor event processors
# Place this in your main config.yaml

# Example 1: Averaging processor with value mapping
sensor_mappings:
  - sensor: temperature
    dmx: 1@0
    value_range:
      from: 0
      to: 1023
  - sensor: light
    dmx: 2@0
    value_range:
      from: 0
      to: 4095

sensor_processor:
  name: averaging
  max_events: 5
  max_time_ms: 500
  min_events: 3
  apply_value_mapping: true

---
# Example 2: Peak detection
sensor_mappings:
  - sensor: motion
    dmx: 1@0
    value_range:
      from: 0
      to: 1023

sensor_processor:
  name: peak
  max_events: 10
  max_time_ms: 1000
  min_events: 1
  apply_value_mapping: true
  params:
    threshold: 500

---
# Example 3: Exponential Moving Average for smooth transitions
sensor_mappings:
  - sensor: presence
    dmx: 1@0
    value_range:
      from: 0
      to: 1023

sensor_processor:
  name: ema
  max_events: 3
  max_time_ms: 200
  min_events: 1
  apply_value_mapping: true
  params:
    alpha: 0.3  # Lower = smoother

---
# Example 4: Median filter for noise reduction
sensor_mappings:
  - sensor: noisy_sensor
    dmx: 1@0
    value_range:
      from: 0
      to: 4095

sensor_processor:
  name: median
  max_events: 7
  max_time_ms: 300
  min_events: 5
  apply_value_mapping: true

---
# Example 5: Change detector (only update on significant change)
sensor_mappings:
  - sensor: position
    dmx: 1@0
    value_range:
      from: 0
      to: 1023

sensor_processor:
  name: change
  max_events: 10
  max_time_ms: 1000
  min_events: 1
  apply_value_mapping: true
  params:
    delta: 50  # Ignore changes smaller than 50

---
# Example 6: Threshold gate (only pass values above threshold)
sensor_mappings:
  - sensor: trigger
    dmx: 1@0
    value_range:
      from: 0
      to: 1023

sensor_processor:
  name: threshold
  max_events: 5
  max_time_ms: 500
  min_events: 1
  apply_value_mapping: true
  params:
    threshold: 512
    above: true

---
# Example 7: Gesture detection (sequential sensor triggers)
sensor_mappings:
  - sensor: button1
    dmx: 1@0
    value_range:
      from: 0
      to: 1023
  - sensor: button2
    dmx: 2@0
    value_range:
      from: 0
      to: 1023
  - sensor: button3
    dmx: 3@0
    value_range:
      from: 0
      to: 1023

sensor_processor:
  name: gesture
  max_events: 20
  max_time_ms: 2000
  min_events: 3
  apply_value_mapping: false
  params:
    sequence:
      - button1
      - button2
      - button3
    threshold: 100
    max_time_between: 500

---
# Example 8: No processor (direct mapping - original behavior)
sensor_mappings:
  - sensor: direct_sensor
    dmx: 1@0
    value_range:
      from: 0
      to: 1023

# No sensor_processor section = direct mapping
