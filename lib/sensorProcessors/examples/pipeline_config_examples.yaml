# Example Sensor Pipeline Configuration
# 
# This file demonstrates how to configure sensor pipelines in the netpins system.
# Pipelines allow you to process raw sensor values before mapping them to DMX channels.
#
# Configuration format:
# sensor_pipelines:
#   - sensor: <sensor_name>
#     value_range:
#       from: <raw_min>
#       to: <raw_max>
#     pipeline:
#       - type: <processor_type>
#         <parameter>: <value>
#         ...
#     dmx: <channel>@<universe>

# ============================================================================
# EXAMPLE 1: Temperature Sensor with Smoothing and Range Mapping
# ============================================================================
# Use case: DHT22 temperature sensor (-40°C to 100°C) mapped to DMX 0-255
# - Maps temperature range to 0-255
# - Smooths readings with moving average
# - Debounces to prevent flickering
# - Outputs to DMX channel 10, universe 1

sensor_pipelines:
  - sensor: temperature_1
    value_range:
      from: -40
      to: 100
    pipeline:
      # Step 1: Map temperature range to DMX range
      - type: range_mapping
        input_min: -40.0
        input_max: 100.0
        output_min: 0.0
        output_max: 255.0
        clamp: true
      
      # Step 2: Smooth out noise with moving average
      - type: moving_average
        window_size: 5
      
      # Step 3: Debounce to prevent rapid changes
      - type: debounce
        duration_ms: 500
    
    dmx: 10@1  # Channel 10, Universe 1

# ============================================================================
# EXAMPLE 2: Motion Sensor with Persistence and Timeout
# ============================================================================
# Use case: PIR motion sensor (0=no motion, 1=motion detected)
# - Motion must persist for 500ms to trigger (debounce)
# - Output stays at 255 for 10 seconds after motion detected
# - Resets to 0 after 60 seconds of no motion
# - Outputs to DMX channel 15, universe 1

  - sensor: motion_sensor_1
    value_range:
      from: 0
      to: 1
    pipeline:
      # Step 1: Debounce to avoid false triggers
      - type: debounce
        duration_ms: 500
      
      # Step 2: Persist motion state for 10 seconds
      - type: persistence
        duration_ms: 10000
        target: 1.0
        default: 0.0
      
      # Step 3: Scale 0-1 to 0-255 DMX range
      - type: range_mapping
        input_min: 0.0
        input_max: 1.0
        output_min: 0.0
        output_max: 255.0
      
      # Step 4: Timeout after 60 seconds of inactivity
      - type: timeout
        duration_ms: 60000
        timeout_value: 0.0
    
    dmx: 15@1

# ============================================================================
# EXAMPLE 3: Analog Light Sensor with Threshold and Hysteresis
# ============================================================================
# Use case: Photoresistor (0-1023) triggers lights only in dark conditions
# - Reads raw ADC values 0-1023
# - Uses hysteresis to prevent flickering at threshold boundary
# - Upper threshold: 700 (turn OFF lights - bright)
# - Lower threshold: 300 (turn ON lights - dark)
# - Smooths with exponential moving average
# - Outputs to DMX channel 20, universe 1

  - sensor: light_sensor_1
    value_range:
      from: 0
      to: 1023
    pipeline:
      # Step 1: Smooth readings with EMA
      - type: ema
        alpha: 0.2
      
      # Step 2: Apply hysteresis threshold
      # When light drops below 300: output 255 (lights ON)
      # When light rises above 700: output 0 (lights OFF)
      - type: hysteresis
        lower: 300.0
        upper: 700.0
        high: 255.0
        low: 0.0
      
      # Step 3: Debounce state changes
      - type: debounce
        duration_ms: 1000
    
    dmx: 20@1

# ============================================================================
# EXAMPLE 4: Rotary Encoder / Potentiometer
# ============================================================================
# Use case: 10k potentiometer (0-1023) for dimmer control
# - Direct ADC reading
# - Minimal smoothing for responsive control
# - Dead zone in center to avoid jitter
# - Outputs to DMX channel 5, universe 1

  - sensor: dimmer_pot_1
    value_range:
      from: 0
      to: 1023
    pipeline:
      # Step 1: Map ADC to DMX range
      - type: range_mapping
        input_min: 0.0
        input_max: 1023.0
        output_min: 0.0
        output_max: 255.0
      
      # Step 2: Apply dead zone in center (±5 units)
      - type: dead_zone
        center: 127.5
        radius: 5.0
      
      # Step 3: Light smoothing for stable output
      - type: moving_average
        window_size: 3
      
      # Step 4: Round to whole numbers
      - type: round
        precision: 1.0
    
    dmx: 5@1

# ============================================================================
# EXAMPLE 5: Humidity Sensor with Time-Based Threshold
# ============================================================================
# Use case: DHT22 humidity sensor (0-100%) triggers ventilation
# - Humidity must exceed 70% for 60 seconds to trigger
# - Maps 0-100% to 0-255 DMX
# - Outputs to DMX channel 25, universe 1

  - sensor: humidity_1
    value_range:
      from: 0
      to: 100
    pipeline:
      # Step 1: Smooth readings
      - type: moving_average
        window_size: 10
      
      # Step 2: Time-based threshold (must exceed 70% for 60s)
      - type: time_threshold
        threshold: 70.0
        duration_ms: 60000
        high: 255.0
        low: 0.0
    
    dmx: 25@1

# ============================================================================
# EXAMPLE 6: Touch Sensor with Multiple Outputs
# ============================================================================
# Use case: Touch sensor controlling multiple channels with different effects
# - Single touch sensor drives two DMX channels
# - Channel 30: Direct on/off
# - Channel 31: Inverted on/off

  - sensor: touch_sensor_1
    value_range:
      from: 0
      to: 1
    pipeline:
      # Debounce touch events
      - type: debounce
        duration_ms: 100
      
      # Scale to DMX range
      - type: range_mapping
        input_min: 0.0
        input_max: 1.0
        output_min: 0.0
        output_max: 255.0
    dmx: 30@1

  # Inverted output for the same sensor
  - sensor: touch_sensor_1
    value_range:
      from: 0
      to: 1
    pipeline:
      - type: debounce
        duration_ms: 100
      
      - type: range_mapping
        input_min: 0.0
        input_max: 1.0
        output_min: 0.0
        output_max: 255.0
      
      # Invert the signal
      - type: invert
        min: 0.0
        max: 255.0
    dmx: 31@1

# ============================================================================
# EXAMPLE 7: Pressure/Force Sensor with Non-Linear Response
# ============================================================================
# Use case: FSR sensor with non-linear calibration
# - Raw values 0-1023
# - Apply threshold to ignore light touches
# - Scale with custom factor
# - Clamp to prevent overrange
# - Outputs to DMX channel 35, universe 2

  - sensor: pressure_sensor_1
    value_range:
      from: 0
      to: 1023
    pipeline:
      # Step 1: Filter out values below 50 (noise threshold)
      - type: threshold
        threshold: 50.0
        above: true
        high: 1.0
        low: 0.0
      
      # Step 2: Scale the response
      - type: scale
        factor: 2.5
        offset: -50.0
      
      # Step 3: Clamp to valid DMX range
      - type: clamp
        min: 0.0
        max: 255.0
      
      # Step 4: Smooth output
      - type: low_pass
        alpha: 0.3
    
    dmx: 35@2

# ============================================================================
# EXAMPLE 8: Distance Sensor (Ultrasonic) with Range Detection
# ============================================================================
# Use case: HC-SR04 ultrasonic sensor (2-400cm)
# - Maps distance to brightness (closer = brighter)
# - Uses band pass to detect specific distance range
# - Outputs to DMX channel 40, universe 2

  - sensor: distance_sensor_1
    value_range:
      from: 2
      to: 400
    pipeline:
      # Step 1: Smooth measurements
      - type: median
        window_size: 5
      
      # Step 2: Detect objects in 20-100cm range
      - type: band_pass
        lower: 20.0
        upper: 100.0
        in_band: 255.0
        out_band: 0.0
      
      # Step 3: Debounce to avoid flicker
      - type: debounce
        duration_ms: 200
    
    dmx: 40@2

# ============================================================================
# EXAMPLE 9: Multiple Temperature Sensors (Living Room)
# ============================================================================
# Use case: Multiple temperature sensors in different rooms
# Each sensor has its own DMX channel for individual monitoring

  - sensor: temp_living_room
    value_range:
      from: -40
      to: 100
    pipeline:
      - type: range_mapping
        input_min: -40.0
        input_max: 100.0
        output_min: 0.0
        output_max: 255.0
      - type: moving_average
        window_size: 10
    dmx: 50@2

  - sensor: temp_bedroom
    value_range:
      from: -40
      to: 100
    pipeline:
      - type: range_mapping
        input_min: -40.0
        input_max: 100.0
        output_min: 0.0
        output_max: 255.0
      - type: moving_average
        window_size: 10
    dmx: 51@2

  - sensor: temp_kitchen
    value_range:
      from: -40
      to: 100
    pipeline:
      - type: range_mapping
        input_min: -40.0
        input_max: 100.0
        output_min: 0.0
        output_max: 255.0
      - type: moving_average
        window_size: 10
    dmx: 52@2

# ============================================================================
# EXAMPLE 10: Advanced Multi-Stage Processing
# ============================================================================
# Use case: Complex sensor with multiple processing stages
# - Ambient light sensor for automatic lighting control
# - Multiple filters and thresholds for different scenarios

  - sensor: ambient_light_main
    value_range:
      from: 0
      to: 1023
    pipeline:
      # Stage 1: Pre-processing
      - type: moving_average
        window_size: 20
      
      - type: kalman
        process_noise: 0.01
        measurement_noise: 0.1
      
      # Stage 2: Range mapping
      - type: range_mapping
        input_min: 0.0
        input_max: 1023.0
        output_min: 0.0
        output_max: 255.0
      
      # Stage 3: Apply hysteresis for stability
      - type: hysteresis
        lower: 100.0
        upper: 150.0
        high: 255.0
        low: 0.0
      
      # Stage 4: Time-based validation
      - type: time_threshold
        threshold: 200.0
        duration_ms: 5000
        high: 255.0
        low: 0.0
      
      # Stage 5: Final debounce
      - type: debounce
        duration_ms: 1000
    
    dmx: 100@2

# ============================================================================
# Notes:
# ============================================================================
# 
# Available Processor Types:
# - range_mapping: Map input range to output range
# - scale: Multiply by factor and add offset
# - clamp: Limit value to min/max range
# - invert: Invert value within range (255 becomes 0)
# - round: Round to specified precision
# - debounce: Stabilize value for duration
# - persistence: Maintain target value for duration
# - timeout: Reset after inactivity period
# - rate_limit: Limit update frequency
# - delay: Delay signal by specified time
# - threshold: Binary threshold with hysteresis
# - hysteresis: Two-level threshold with upper/lower bounds
# - time_threshold: Threshold that must persist for duration
# - range_threshold: Check if value is within range
# - band_pass: Pass values within specific band
# - dead_zone: Ignore small changes around center value
# - moving_average: Simple moving average filter
# - ema: Exponential moving average
# - median: Median filter for spike removal
# - weighted_average: Weighted moving average
# - low_pass: Low-pass filter for smoothing
# - kalman: Kalman filter for optimal estimation
#
# DMX Format:
# - Format: channel@universe
# - Channel: 1-512 (1-based)
# - Universe: 0-65535
# - Example: 10@1 means channel 10 on universe 1
#
# Value Range:
# - Defines the raw sensor reading range
# - Used to normalize sensor values before processing
# - Common ranges:
#   * Analog sensors: 0-1023 (10-bit ADC)
#   * Digital sensors: 0-1
#   * Temperature: -40 to 100 (Celsius)
#   * Humidity: 0-100 (percent)
