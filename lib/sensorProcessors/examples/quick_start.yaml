# Quick Start: Basic Sensor Pipeline Configuration
#
# Copy this section into your main config.yaml file under the root level.
# Customize sensor names, value ranges, and DMX channels to match your hardware.

sensor_pipelines:
  # Temperature sensor: -40°C to 100°C -> DMX channel 10
  - sensor: temperature_1
    value_range:
      from: -40
      to: 100
    pipeline:
      - type: range_mapping
        input_min: -40.0
        input_max: 100.0
        output_min: 0.0
        output_max: 255.0
      - type: moving_average
        window_size: 5
      - type: debounce
        duration_ms: 500
    dmx: 10@1

  # Motion sensor: 0/1 -> DMX channel 15 (persist for 10 seconds)
  - sensor: motion_sensor_1
    value_range:
      from: 0
      to: 1
    pipeline:
      - type: debounce
        duration_ms: 500
      - type: persistence
        duration_ms: 10000
        target: 1.0
        default: 0.0
      - type: range_mapping
        input_min: 0.0
        input_max: 1.0
        output_min: 0.0
        output_max: 255.0
    dmx: 15@1

  # Light sensor: 0-1023 -> DMX channel 20 (auto-lights with hysteresis)
  - sensor: light_sensor_1
    value_range:
      from: 0
      to: 1023
    pipeline:
      - type: ema
        alpha: 0.2
      - type: hysteresis
        lower: 300.0
        upper: 700.0
        high: 255.0
        low: 0.0
      - type: debounce
        duration_ms: 1000
    dmx: 20@1

  # Analog sensor (potentiometer): 0-1023 -> DMX channel 5
  - sensor: analog_sensor_1
    value_range:
      from: 0
      to: 1023
    pipeline:
      - type: range_mapping
        input_min: 0.0
        input_max: 1023.0
        output_min: 0.0
        output_max: 255.0
      - type: moving_average
        window_size: 3
    dmx: 5@1
